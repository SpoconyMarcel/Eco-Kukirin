name: Build Eco Kukirin

on:
  push:
    branches: [main, master]
    tags: ['v*']        # np. git tag v1.0.0 -> automatyczny Release z .jar
  pull_request:
  workflow_dispatch:    # reczne odpalenie z zakladki Actions

permissions:
  contents: write       # potrzebne do tworzenia Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (bez wrappera - instaluje Gradle 8.5)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build
        run: gradle build --no-daemon

      - name: Upload .jar (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: eco-kukirin-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: GitHub Release (tylko dla tagow v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          generate_release_notes: true
